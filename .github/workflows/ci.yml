name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: "3.12", enable-cache: true}
      - run: uv sync --all-extras --group dev --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Unit and integration tests
        run: uv run pytest -q

  offline-eval:
    # Full pipeline with the no-LLM baseline: catches broken prompts/graph/SQL guard/metrics
    # on every pull request at zero model cost.
    runs-on: ubuntu-latest
    needs: quality
    env:
      INSIGHTLY_LLM_PROVIDER: offline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: "3.12", enable-cache: true}
      - run: uv sync --frozen
      - run: uv run insightly data synthetic --users 3000 && uv run insightly data curate
      - run: uv run insightly eval run
      - run: uv run insightly eval gate
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: offline-eval-report, path: reports/eval/}

  cdk-synth:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: "3.12", enable-cache: true}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: uv sync --group infra --frozen
      - working-directory: infra
        run: uv run --group infra npx -y aws-cdk@2 synth --quiet
