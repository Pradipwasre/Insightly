name: deploy
# Manual deploy with GitHub OIDC (no long-lived AWS keys). See docs/aws-deployment-guide.md
# step 12 for creating the IAM role and the AWS_DEPLOY_ROLE_ARN repository variable.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: "3.12", enable-cache: true}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: docker/setup-qemu-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: uv sync --group infra --frozen
      - working-directory: infra
        run: uv run --group infra npx -y aws-cdk@2 deploy --all --require-approval never -c region=${{ vars.AWS_REGION }} -c alertEmail=${{ vars.ALERT_EMAIL }}
