[project]
name = "insightly"
version = "1.0.0"
description = "Insightly: governed text-to-SQL analytics agent (LangGraph + OpenAI) on AWS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langgraph>=1.2,<2",
  "langchain>=1.4,<2",
  "langchain-core>=1.6,<2",
  "langchain-openai>=1.7,<2",
  "langgraph-checkpoint-postgres>=3.2,<4",
  "langsmith>=0.14,<1",
  "openai>=3.35,<4",
  "fastapi>=0.156,<1",
  "uvicorn[standard]>=0.54,<1",
  "sse-starlette>=3.5,<4",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "sqlglot>=30.24,<31",
  "duckdb>=1.5,<2",
  "pyathena>=4.2,<5",
  "boto3>=1.43,<2",
  "psycopg[binary,pool]>=3.3,<4",
  "pgvector>=0.5,<1",
  "numpy>=2.2,<3",
  "pandas>=2.3,<4",
  "pyarrow>=21,<30",
  "pyyaml>=6.0,<7",
  "pyjwt[crypto]>=2.15,<3",
  "httpx>=0.28,<1",
  "tenacity>=9.2,<10",
  "structlog>=26.1",
  "mcp>=2.3,<3",
  "typer>=0.16,<1",
  "rich>=14,<16",
]

[project.optional-dependencies]
ui = ["streamlit>=1.66,<2", "plotly>=7.1,<8"]
otel = ["opentelemetry-sdk>=1.45,<2", "opentelemetry-exporter-otlp>=1.45,<2"]

[dependency-groups]
dev = [
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.2",
  "ruff>=0.17",
  "mypy>=1.18",
  "types-PyYAML",
]
infra = [
  "aws-cdk-lib>=2.274,<3",
  "constructs>=10.4,<11",
]

[project.scripts]
insightly = "insightly.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insightly"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# FastAPI Depends() and Typer Option() defaults are idiomatic
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
