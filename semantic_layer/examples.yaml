# Verified question -> SQL pairs used as few-shot examples (Trino / Athena dialect).
# These are TRAINING knowledge. They must never duplicate questions in evals/golden.
version: 3
examples:
  - question: What was net revenue by department in 2022?
    sql: |
      SELECT p.department,
             SUM(CASE WHEN oi.status NOT IN ('Cancelled', 'Returned') THEN oi.sale_price ELSE 0 END) AS net_revenue
      FROM order_items AS oi
      JOIN products AS p ON oi.product_id = p.id
      WHERE oi.created_at >= TIMESTAMP '2022-01-01 00:00:00' AND oi.created_at < TIMESTAMP '2023-01-01 00:00:00'
      GROUP BY p.department
      ORDER BY net_revenue DESC
  - question: Show monthly order count for 2021
    sql: |
      SELECT date_trunc('month', o.created_at) AS month, COUNT(DISTINCT o.order_id) AS orders
      FROM orders AS o
      WHERE o.created_at >= TIMESTAMP '2021-01-01 00:00:00' AND o.created_at < TIMESTAMP '2022-01-01 00:00:00'
      GROUP BY 1
      ORDER BY 1
  - question: Which 5 brands have the highest gross profit?
    sql: |
      SELECT p.brand,
             SUM(CASE WHEN oi.status NOT IN ('Cancelled', 'Returned') THEN oi.sale_price - ii.cost ELSE 0 END) AS gross_profit
      FROM order_items AS oi
      JOIN inventory_items AS ii ON oi.inventory_item_id = ii.id
      JOIN products AS p ON oi.product_id = p.id
      GROUP BY p.brand
      ORDER BY gross_profit DESC
      LIMIT 5
  - question: Return rate by order month in 2023
    sql: |
      SELECT date_trunc('month', o.created_at) AS month,
             100.0 * COUNT_IF(o.status = 'Returned') / NULLIF(COUNT(*), 0) AS return_rate_pct
      FROM orders AS o
      WHERE o.created_at >= TIMESTAMP '2023-01-01 00:00:00' AND o.created_at < TIMESTAMP '2024-01-01 00:00:00'
      GROUP BY 1
      ORDER BY 1
  - question: How many customers signed up from each traffic source?
    sql: |
      SELECT u.traffic_source, COUNT(*) AS customers
      FROM users AS u
      GROUP BY u.traffic_source
      ORDER BY customers DESC
  - question: Average delivery days by distribution center
    sql: |
      SELECT dc.name AS distribution_center,
             AVG(date_diff('hour', oi.created_at, oi.delivered_at)) / 24.0 AS avg_delivery_days
      FROM order_items AS oi
      JOIN products AS p ON oi.product_id = p.id
      JOIN distribution_centers AS dc ON p.distribution_center_id = dc.id
      WHERE oi.delivered_at IS NOT NULL
      GROUP BY dc.name
      ORDER BY avg_delivery_days
  - question: Session conversion rate by browser
    sql: |
      SELECT e.browser,
             100.0 * COUNT(DISTINCT CASE WHEN e.event_type = 'purchase' THEN e.session_id END)
               / NULLIF(COUNT(DISTINCT CASE WHEN e.event_type = 'product' THEN e.session_id END), 0) AS conversion_rate_pct
      FROM events AS e
      GROUP BY e.browser
      ORDER BY conversion_rate_pct DESC
  - question: Sell-through rate by product category group
    sql: |
      SELECT p.category_group,
             100.0 * COUNT(ii.sold_at) / NULLIF(COUNT(*), 0) AS sell_through_pct
      FROM inventory_items AS ii
      JOIN products AS p ON ii.product_id = p.id
      GROUP BY p.category_group
      ORDER BY sell_through_pct DESC
  - question: Number of orders by status
    sql: |
      SELECT o.status, COUNT(*) AS orders
      FROM orders AS o
      GROUP BY o.status
      ORDER BY orders DESC
  - question: Average order value by customer country
    sql: |
      SELECT u.country,
             SUM(CASE WHEN oi.status NOT IN ('Cancelled', 'Returned') THEN oi.sale_price ELSE 0 END)
               / NULLIF(COUNT(DISTINCT CASE WHEN oi.status NOT IN ('Cancelled', 'Returned') THEN oi.order_id END), 0) AS aov
      FROM order_items AS oi
      JOIN users AS u ON oi.user_id = u.id
      GROUP BY u.country
      ORDER BY aov DESC
  - question: Top 10 products by units sold
    sql: |
      SELECT p.name, COUNT(*) AS units_sold
      FROM order_items AS oi
      JOIN products AS p ON oi.product_id = p.id
      WHERE oi.status NOT IN ('Cancelled', 'Returned')
      GROUP BY p.name
      ORDER BY units_sold DESC
      LIMIT 10
  - question: Average retail price by department excluding test prices
    sql: |
      SELECT p.department, AVG(p.retail_price) AS avg_retail_price
      FROM products AS p
      WHERE NOT p.is_test_price
      GROUP BY p.department
  - question: Yearly active customers
    sql: |
      SELECT year(o.created_at) AS year, COUNT(DISTINCT o.user_id) AS active_customers
      FROM orders AS o
      GROUP BY 1
      ORDER BY 1
  - question: Web sessions by channel
    sql: |
      SELECT e.channel, COUNT(DISTINCT e.session_id) AS sessions
      FROM events AS e
      GROUP BY e.channel
      ORDER BY sessions DESC
  - question: Cancellation rate by customer gender
    sql: |
      SELECT o.gender, 100.0 * COUNT_IF(o.status = 'Cancelled') / NULLIF(COUNT(*), 0) AS cancellation_rate_pct
      FROM orders AS o
      GROUP BY o.gender
  - question: Units still in stock per distribution center
    sql: |
      SELECT dc.name AS distribution_center, COUNT(*) AS units_in_stock
      FROM inventory_items AS ii
      JOIN distribution_centers AS dc ON ii.product_distribution_center_id = dc.id
      WHERE ii.sold_at IS NULL
      GROUP BY dc.name
      ORDER BY units_in_stock DESC
