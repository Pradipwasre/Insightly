# Certified metrics. The agent must use these definitions when a question mentions them.
version: 3
metrics:
  - id: net_revenue
    name: Net revenue
    synonyms: [revenue, sales, turnover, gmv net, income from sales]
    description: Sum of sale price for items that were not cancelled or returned.
    sql: "SUM(CASE WHEN oi.status NOT IN ('Cancelled', 'Returned') THEN oi.sale_price ELSE 0 END)"
    tables: [order_items]
    alias_hint: "order_items AS oi"

  - id: gross_revenue
    name: Gross revenue
    synonyms: [gross sales, total sales including returns, gmv]
    description: Sum of sale price for all items regardless of status.
    sql: "SUM(oi.sale_price)"
    tables: [order_items]
    alias_hint: "order_items AS oi"

  - id: gross_profit
    name: Gross profit
    synonyms: [profit, margin dollars, earnings]
    description: Sale price minus unit cost for items not cancelled or returned.
    sql: "SUM(CASE WHEN oi.status NOT IN ('Cancelled', 'Returned') THEN oi.sale_price - ii.cost ELSE 0 END)"
    tables: [order_items, inventory_items]
    alias_hint: "order_items AS oi JOIN inventory_items AS ii ON oi.inventory_item_id = ii.id"

  - id: gross_margin_pct
    name: Gross margin %
    synonyms: [margin, margin percent, profit margin]
    description: Gross profit divided by net revenue, as a percentage.
    sql: "100.0 * SUM(CASE WHEN oi.status NOT IN ('Cancelled', 'Returned') THEN oi.sale_price - ii.cost ELSE 0 END) / NULLIF(SUM(CASE WHEN oi.status NOT IN ('Cancelled', 'Returned') THEN oi.sale_price ELSE 0 END), 0)"
    tables: [order_items, inventory_items]
    alias_hint: "order_items AS oi JOIN inventory_items AS ii ON oi.inventory_item_id = ii.id"

  - id: order_count
    name: Orders
    synonyms: [number of orders, order volume, orders placed]
    description: Count of distinct orders.
    sql: "COUNT(DISTINCT o.order_id)"
    tables: [orders]
    alias_hint: "orders AS o"

  - id: return_rate
    name: Return rate
    synonyms: [returns percentage, "% returned", return ratio]
    description: Returned orders divided by all orders, as a percentage.
    sql: "100.0 * COUNT_IF(o.status = 'Returned') / NULLIF(COUNT(*), 0)"
    tables: [orders]
    alias_hint: "orders AS o"

  - id: cancellation_rate
    name: Cancellation rate
    synonyms: [cancel rate, "% cancelled"]
    description: Cancelled orders divided by all orders, as a percentage.
    sql: "100.0 * COUNT_IF(o.status = 'Cancelled') / NULLIF(COUNT(*), 0)"
    tables: [orders]
    alias_hint: "orders AS o"

  - id: average_order_value
    name: Average order value
    synonyms: [aov, basket size, average basket]
    description: Net revenue divided by number of orders that have at least one kept item.
    sql: "SUM(CASE WHEN oi.status NOT IN ('Cancelled', 'Returned') THEN oi.sale_price ELSE 0 END) / NULLIF(COUNT(DISTINCT CASE WHEN oi.status NOT IN ('Cancelled', 'Returned') THEN oi.order_id END), 0)"
    tables: [order_items]
    alias_hint: "order_items AS oi"

  - id: avg_delivery_days
    name: Average delivery time (days)
    synonyms: [delivery time, shipping time, days to deliver, lead time]
    description: Average days between order creation and delivery, for delivered orders.
    sql: "AVG(date_diff('hour', o.created_at, o.delivered_at)) / 24.0"
    tables: [orders]
    alias_hint: "orders AS o"
    filters: "o.delivered_at IS NOT NULL"

  - id: session_conversion_rate
    name: Session conversion rate
    synonyms: [conversion, conversion rate, funnel conversion, purchase rate]
    description: Sessions with a purchase event divided by sessions with a product view, as a percentage.
    sql: "100.0 * COUNT(DISTINCT CASE WHEN e.event_type = 'purchase' THEN e.session_id END) / NULLIF(COUNT(DISTINCT CASE WHEN e.event_type = 'product' THEN e.session_id END), 0)"
    tables: [events]
    alias_hint: "events AS e"

  - id: sell_through_rate
    name: Sell-through rate
    synonyms: [sell through, "inventory sold %", stock sold]
    description: Units sold divided by units received, as a percentage.
    sql: "100.0 * COUNT(ii.sold_at) / NULLIF(COUNT(*), 0)"
    tables: [inventory_items]
    alias_hint: "inventory_items AS ii"

  - id: active_customers
    name: Active customers
    synonyms: [buyers, purchasing customers, customers who ordered]
    description: Distinct users with at least one order in the period.
    sql: "COUNT(DISTINCT o.user_id)"
    tables: [orders]
    alias_hint: "orders AS o"
